/* v0.7: compact IDs, immutable detail viewer and assignment review. */
.row-actions,.action-inline{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.row-actions .mini-button{white-space:nowrap;font-size:12px;padding:6px 9px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}
.property-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:11px 0 20px}
.property-grid>div{border:1px solid #dde7f2;background:#fafcff;border-radius:8px;padding:12px 14px;min-width:0}
.property-grid small,.id-tiles small{display:block;color:#60738a;font-size:11px;margin-bottom:5px}
.property-grid strong{display:block;font-size:16px;color:#183e69;word-break:break-word}
.id-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:13px 0 20px}
.id-tiles>div{border:1px solid #d2e0f0;background:#f6faff;border-radius:10px;padding:13px;min-width:0}
.id-tiles b{display:block;font-size:18px;color:#2059a0;margin-bottom:4px}
.id-tiles span{font-size:12px;color:#536e8b;overflow-wrap:anywhere}
.wizard-dialog{width:min(850px,calc(100vw - 35px));max-height:90vh;overflow:auto}
.wizard-dialog .form-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.wizard-dialog label,.assignment-controls label{display:grid;gap:5px;font-size:12px;font-weight:650;color:#455f7e}
.wizard-dialog input,.wizard-dialog select,.assignment-controls input,.assignment-controls select{width:100%;padding:10px;border:1px solid #b9cee4;border-radius:7px;background:#fff;min-width:0}
.entry-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px;margin:15px 0}
.entry-form-grid label{display:grid;gap:7px}
.assignment-controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.assignment-controls label:first-child{flex:1 1 160px}.assignment-controls label:nth-of-type(2){flex:1 1 230px}
.assignment-table td{vertical-align:middle}.assignment-table select{min-width:170px;max-width:270px;width:100%;border:1px solid #c8d7e9;padding:8px 9px;border-radius:7px;background:white;color:#163f6a}
.assignment-table td small{display:block;color:#7688a0;margin-top:3px;font-size:11px}
.assignment-table .row-changed{background:#f1f8ff}.changed-label{color:#0d65bb!important;font-weight:700}
.assignment-table td:first-child{min-width:35px}
.soft-panel{border:1px solid #dde8f2;background:#f8fbff;padding:14px;border-radius:8px;margin:12px 0}
.infil-item strong{display:block;font-size:12px;margin:3px 0;color:inherit}
.grid td .mono{color:#194e91}.grid td strong.mono{color:#104688}
@media (max-width:850px){.id-tiles,.wizard-dialog .form-stack,.entry-form-grid{grid-template-columns:1fr}.assignment-table select{min-width:130px}.row-actions{flex-direction:column;align-items:stretch}}
/* v0.8: explicit source/display units, read-only SQL selection and visual diff review */
.top-unit{display:flex;align-items:center;gap:7px;font-size:11px;color:#c3dcf5;white-space:nowrap}
.top-unit select{padding:9px 10px;border-radius:7px;border:1px solid #8bb9e7;background:#edf5ff;color:#1b4c7f;font-size:12px;font-weight:750}
.sql-panel{border:1px solid #d2e5f5;background:#f6faff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.sql-panel h4{margin:0 0 6px;color:#1c609f}.sql-panel .section-heading{margin-bottom:12px}
.sql-label{display:grid;gap:7px;color:#416180;font-size:12px;font-weight:800}
.sql-panel textarea{min-height:70px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.5;padding:12px;width:100%;border:1px solid #b4cbe6;background:white;color:#193d63;border-radius:8px}
.sql-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:11px 0}.sql-status{font-size:11px;color:#46718d}
.sql-panel details{margin-top:9px;color:#3c688b;font-size:11px}.sql-panel summary{cursor:pointer;font-weight:700}
.sql-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:11px;background:#eaf3fd;border-radius:6px;padding:11px}
.sql-panel code{font-family:ui-monospace,Consolas,monospace;color:#1b5185}
.change-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 13px;font-size:11px;color:#50738f}
.change-legend span{display:flex;gap:6px;align-items:center}.change-legend i{display:inline-block;width:15px;height:15px;border:1px solid #bdcddd;border-radius:3px}
.legend-modified{background:#fff1b9}.legend-new{background:#def4d7}
.grid td.diff-cell{position:relative;cursor:pointer;padding-right:22px;font-weight:750;outline-offset:-2px}
.grid td.diff-cell.diff-modified{background:#fff1b9;color:#794d00}.grid td.diff-cell.diff-new{background:#def4d7;color:#326834}
.grid td.diff-cell:hover,.grid td.diff-cell:focus{outline:2px solid #2d79bd;outline-offset:-2px;filter:brightness(.97)}
.diff-mark{position:absolute;top:3px;right:5px;font-size:12px;color:inherit}
.diff-comparison{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;margin:23px 0}
.diff-comparison>div{padding:20px;border:1px solid #cfdbeb;border-radius:9px;background:#f6faff;min-width:0}
.diff-comparison small{display:block;font-size:11px;color:#7188a0;margin-bottom:8px}
.diff-comparison strong{font-size:18px;color:#164e87;overflow-wrap:anywhere}
.grid th small{font-weight:400;text-transform:none}
@media(max-width:1000px){.top-unit{order:3}.topbar{flex-wrap:wrap;height:auto;gap:9px;padding:12px}}

/* v0.8.5: protect noncanonical ICM runoff surface layouts */
.validation-panel{border:1px solid #e8c794;background:#fffcf6;margin:16px 0}
.validation-panel h3{color:#824c0c}.validation-count{border:1px solid #dfa85c;background:#fff0d6;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:800;color:#7d4b10}
.warning-reason{font-size:12px;line-height:1.45;color:#834a19;margin:4px 0}.validation-note{font-size:12px;color:#685033;margin-top:12px}
.row-unsupported{background:#fff2ed}.row-unsupported td{color:#796058}
.invalid-pill{display:inline-block;color:#9a2b21!important;font-weight:800!important;background:#ffe0d8;border-radius:5px;padding:3px 5px}
</style></head>

  throw Error('Assignment plan has duplicate subcatchments');
 let working=project;
 for(const req of requests){
  if(!req.include)continue;
  const sub=working.tables.subcatchment.rows.find(x=>x.subcatchment_id===req.subcatchmentId);
  if(!sub)throw Error(`Unknown subcatchment ${req.subcatchmentId}`);
  const target=getLibrary(working,req.libraryKey);if(!target)throw Error('Unknown proposed target library');
  const chosen=req.landUseId??target.landUseId;
  if(chosen&&sub.land_use_id===chosen)continue;
  working=assignSubcatchments(working,req.libraryKey,[req.subcatchmentId],
    req.zeroPct??zeroPct,req.landUseId).project;
 }

// Inspect imported InfoWorks land-use surface layouts without modifying any rows.

function inspectIcmSurfaceLayouts(tables) {
  const surfaceMap = new Map(tables.runoff_surface.rows.map(row => [layoutClean(row.runoff_index), row]));
  const landUseMap = new Map();

    const assigned = Array.from({length:12}, (_,i) => ({slot:i+1, id:layoutClean(lu[`runoff_index_${i+1}`])})).filter(x => layoutPresent(x.id));
    const issues = [];

    if (assigned.length !== 3 || assigned.some((x,i) => x.slot !== i+1)) {
      add('SURFACE_SLOTS', `Expected exactly slots 1, 2, 3; found ${assigned.map(x=>x.slot).join(', ') || '(none)'}.`);
    }
    const ids = assigned.map(x=>x.id);
    if (new Set(ids).size !== ids.length) add('REPEATED_SURFACE', 'The same runoff surface is referenced in multiple slots.');
    for (const {slot,id} of assigned) if (!surfaceMap.has(id)) add('MISSING_SURFACE', `Slot ${slot} references missing runoff surface ${id}.`);
    const refs = [1,2,3].map(i => surfaceMap.get(layoutClean(lu[`runoff_index_${i}`])) || null);
    const slots = assigned.map(({slot,id}) => ({slot,surfaceId:id, surfaceType:surfaceMap.get(id)?.surface_type ?? '', runoffVolumeType:surfaceMap.get(id)?.runoff_volume_type ?? '', routingModel:surfaceMap.get(id)?.routing_model ?? ''}));

    // properties, not merely inferred from its position or the area shares.

      if (s.runoff_coefficient!==undefined && s.runoff_coefficient!=='' && Math.abs(Number(s.runoff_coefficient)-1)>0.0000001) add('RUNOFF_COEFFICIENT', `Slot ${slot}: expected fixed runoff coefficient 1.`);
    }

      add('ZERO_STORAGE_NOT_ZERO', `Slot 2 depression storage is ${refs[1].initial_loss_value}; expected zero.`);

    const p=refs[2];
    if (p?.runoff_volume_type==='GreenAmpt') for(const field of ['average_capillary_suction','saturated_hydraulic_conductivity','initial_moisture_deficit']) {

    landUses:[...landUseMap.values()],subcatchments,
    compatibleLandUseIds:[...landUseMap.values()].filter(x=>x.conforms).map(x=>x.landUseId),
    unsupportedLandUseIds:[...landUseMap.values()].filter(x=>!x.conforms).map(x=>x.landUseId),

// ICM Metric (Native) and MGD display presets. Internal ICM values stay native.
// Source XPX 'MGD' means XPX US customary (DATA METRIC=0), not a flow-only conversion.
const UNIT_SYSTEMS=['Metric','MGD'];
const MM_PER_IN=25.4, HA_PER_ACRE=0.40468564224, M_PER_FT=0.3048;

function displayUnit(key,system){if(['initial','limiting','conductivity','initial_infiltration','limiting_infiltration','saturated_hydraulic_conductivity'].includes(key))return system==='MGD'?'in/hr':'mm/hr';if(['suction','imperviousStorageMm','perviousStorageMm','maxVolume','suctionMm','depressionStorageMm','max_infiltration_volume','average_capillary_suction'].includes(key))return system==='MGD'?'in':'mm';if(['initial_loss_value'].includes(key))return system==='MGD'?'in':'mm';if(['total_area','contributing_area'].includes(key))return system==='MGD'?'acre':'ha';if(['catchment_dimension'].includes(key))return system==='MGD'?'ft':'m';if(['decay'].includes(key))return '1/hr';return ''}
function num(v){return v===''||v==null||!Number.isFinite(Number(v))?null:Number(v);}
function format(v){return String(Number(Number(v).toPrecision(12)));}
function toDisplay(key,val,system,table='params'){
 const n=num(val);if(n===null)return val;

// ICM network CSV exports may use local display units, and a normal CSV has
// no global unit system marker. Caller MUST explicitly supply its export units.
// These are the documented SWMM/InfoWorks network columns we can safely map.
// Conversion is done once at the import boundary; the model always stores
// InfoWorks-native Metric values after import.
const ICM_INCHES_TO_METERS=0.0254;
const ICM_CSV_UNITS=Object.freeze({
 runoff_surface:Object.freeze({
  initial_loss_value:ICM_INCHES_TO_METERS,
  average_capillary_suction:MM_PER_IN,
  max_infiltration_volume:MM_PER_IN,
  initial_infiltration:MM_PER_IN,
  limiting_infiltration:MM_PER_IN,
  saturated_hydraulic_conductivity:MM_PER_IN,
  maximum_deficit:MM_PER_IN,
 }),
 landuse:Object.freeze({}),
 subcatchment:Object.freeze({
  total_area:HA_PER_ACRE,contributing_area:HA_PER_ACRE,
  catchment_dimension:M_PER_FT,
  ...Object.fromEntries(Array.from({length:11},(_,i)=>[`area_absolute_${i+1}`,HA_PER_ACRE]))

function normalizeIcmInputTables(tables,unitSystem){
 if(!UNIT_SYSTEMS.includes(unitSystem))throw Error('Choose Metric (Native) or MGD for the ICM CSV export.');
 const normalized=structuredClone(tables);
 if(unitSystem==='Metric')return normalized;
 for(const [type,table] of Object.entries(normalized)){
  const converters=ICM_CSV_UNITS[type]||{};
  for(const row of table.rows){
   for(const [field,multiplier] of Object.entries(converters)){
    if(!table.headers.includes(field)||row[field]===''||row[field]===undefined)continue;
    const value=Number(row[field]);
    if(!Number.isFinite(value))throw Error(`${type}.${field} is not a valid number: ${row[field]}`);

   }

 }

}

 <section class="card"><div class="section-heading"><div><h3>Review & Download ICM ZIP</h3><p>Existing imported records are preserved. Only applied assignment changes are included in the three exported staging CSVs.</p></div><div class="segmented">${[['runoff_surface','Runoff surface'],['landuse','Land use'],['subcatchment','Subcatchment']].map(([k,t])=>`<button data-preview="${k}" class="${previewType===k?'active':''}">${t}</button>`).join('')}</div></div>
 <div class="change-legend"><span><i class="legend-modified"></i> Changed cell</span><span><i class="legend-new"></i> New record</span><span>Hover or click highlighted cells to see before → after</span></div>
 ${previewGrid(previewType,table,cols)}</section> <div class="banner info">ICM staging export only. Import and validate the three CSVs in a <b>copy</b> of the target ICM network; merge/upsert behavior has not yet been verified. Unused custom definitions stay session-only.</div>
 <div class="page-actions"><button class="subtle" id="prevStep">← Model Hydrology Library</button><button class="primary" id="downloadBottom" ${staged?'disabled':''}>↓ Download ICM ZIP</button></div>`;
}
function openAssignmentPreview(){try{lastPreview=previewXpxAssignments(session);
 const rows=lastPreview.changes;
 dialog('Review Assignment Changes',`<p><b>${rows.length}</b> subcatchment(s) will change. Nothing has been applied yet.</p><div class="table-wrap"><table class="grid"><thead><tr><th>Subcatchment</th><th>Current ID</th><th>Proposed ID</th><th>Generic IDs (proposed)</th><th>Active runoff areas before → after</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.before)}</td><td><b>${esc(x.after)}</b></td><td class="mono">Soil ${esc(x.newLinks.soil)}<br>Cover ${esc(x.newLinks.pervious)} / ${esc(x.newLinks.impervious)}</td><td><strong>${esc(x.areaMode)}</strong><br>${esc(x.oldArea.join(' / '))}<br>→ ${esc(x.newArea.join(' / '))}</td></tr>`).join('')}</tbody></table></div><div class="page-actions"><button class="subtle" id="cancelAssignments">Cancel</button><button class="primary" id="applyAssignments">Apply ${rows.length} Assignment(s)</button></div>`);
 $('cancelAssignments').onclick=closeDialog;$('applyAssignments').onclick=()=>{try{session=applyXpxAssignments(session,lastPreview);lastPreview=null;closeDialog();render();notice(`Applied ${rows.length} assignment changes. ICM ZIP is ready.`);}catch(e){notice(e.message,true)}};
 }catch(e){notice(e.message,true)}}
function bind(){
 if($('startImport'))$('startImport').onclick=()=>$('fileInput').click();if($('startIcmZip'))$('startIcmZip').onclick=()=>$('icmZipInput').click();if($('loadExample'))$('loadExample').onclick=loadDemo;
 if($('nextStep'))$('nextStep').onclick=()=>{step=Math.min(3,step+1);render()};if($('prevStep'))$('prevStep').onclick=()=>{step=Math.max(1,step-1);render()};
 if(!session)return;
 if(step===1){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewGeneric(b.dataset.role,b.dataset.view));
  document.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>openDuplicateGeneric(b.dataset.role,b.dataset.duplicate));
 }else if(step===2){document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{selectedModel=b.dataset.model;render()});if($('copyModel'))$('copyModel').onclick=()=>openDuplicateModel(selectedModel);
 }else{
  $('sqlQuery').oninput=e=>{sqlText=e.target.value};
  $('runSql').onclick=()=>{try{const result=selectSubcatchments(sqlText,session.project.tables.subcatchment);sqlIds=new Set(result.ids);sqlOrderedIds=result.ids;sqlColumns=result.columns;checked=new Set(result.ids);sqlMessage=`${result.ids.length} matching subcatchment(s) selected. Choose a land use and stage assignment.`;render();notice(`SQL selected ${result.ids.length} subcatchment(s); no assignments changed.`);}catch(err){notice(`SQL: ${err.message}`,true)}};
  $('clearSql').onclick=()=>{sqlIds=null;sqlOrderedIds=null;sqlMessage='SQL filter cleared';checked.clear();render()};
  document.querySelectorAll('[data-diff-row]').forEach(e=>{const action=()=>openDiff(previewType,e.dataset.diffRow,e.dataset.diffCol);e.onclick=action;e.onkeydown=x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();action()}}});
  $('searchSubs').oninput=e=>{search=e.target.value;render();$('searchSubs').focus();$('searchSubs').setSelectionRange(search.length,search.length)};
  document.querySelectorAll('[data-assign]').forEach(e=>e.onchange=()=>{try{session=stageXpxAssignments(session,[{subcatchmentId:e.dataset.assign,landUseId:e.value}]);lastPreview=null;render();}catch(err){notice(err.message,true)}});
  document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?checked.add(e.dataset.check):checked.delete(e.dataset.check)});
  $('allVisible').onchange=e=>{document.querySelectorAll('[data-check]:not([disabled])').forEach(c=>{c.checked=e.target.checked;e.target.checked?checked.add(c.dataset.check):checked.delete(c.dataset.check)})};
  $('selectVisible').onclick=()=>{document.querySelectorAll('[data-check]:not([disabled])').forEach(c=>checked.add(c.dataset.check));render()};
  $('clearSelected').onclick=()=>{checked.clear();render()};
  $('bulkApply').onclick=()=>{const id=$('bulkModel').value;if(!id){notice('Choose a Model Land Use ID first.',true);return}if(!checked.size){notice('Select subcatchments first.',true);return}
   try{session=stageXpxAssignments(session,[...checked].map(subcatchmentId=>({subcatchmentId,landUseId:id})));lastPreview=null;checked.clear();render();notice('Bulk assignments staged. Preview to apply.')}catch(e){notice(e.message,true)}};
  $('resetAssignments').onclick=()=>{session=structuredClone(session);session.proposedAssignments=Object.fromEntries(session.project.tables.subcatchment.rows.map(r=>[r.subcatchment_id,r.land_use_id]));lastPreview=null;render();notice('Unapplied assignment changes discarded.')};
  $('previewAssignments').onclick=openAssignmentPreview;
  document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{previewType=b.dataset.preview;render()});
  $('downloadBottom').onclick=downloadZip;
 }
}
async function downloadZip(){if(!session)return;if(pendingChanges()){notice('Preview and apply assignments before exporting.',true);return}
 try{const zip=new JSZip();for(const k of ['runoff_surface','landuse','subcatchment'])zip.file(k+'.csv',writeCsv(session.project.tables[k]));
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ICM_LandUse_Staging_Export_v0.8.5.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);notice('ICM staging ZIP downloaded. Validate import in a copy of your ICM network.');
 }catch(e){notice(e.message,true)}}
function loadText(text,filename,srcUnit=null){try{session=startXpxConversion(text,ref,{filename,sourceUnit:srcUnit});step=1;tab='soil';selectedModel=session.project.libraries[0]?.key;checked.clear();search='';sqlIds=null;sqlOrderedIds=null;sqlMessage='';lastPreview=null;render();notice(`Imported ${filename}. Grouped matching soil and cover parameter sets.`)}catch(e){notice(`XPX import failed: ${e.message}`,true)}}
function loadDemo(){loadText(window.DEMO_HORTON_XPX,'runoff_horton_example.xpx','MGD')}
function configureXpxImport(text,filename){let detected;try{detected=sourceUnits(text)}catch(e){notice(e.message,true);return}
 dialog('Import XPX · Source and Display Units',`<p>Confirm how the input XPX values are stored. We check your selection against the XPX <code>DATA METRIC</code> header to prevent incorrect conversion.</p>
 <div class="form-stack"><label>XPX source units<select id="sourceUnits"><option value="Metric" ${detected==='Metric'?'selected':''}>Metric</option><option value="MGD" ${detected==='MGD'?'selected':''}>MGD (US customary)</option></select></label><label>Application display units<select id="importDisplayUnits"><option value="Metric" ${displaySystem==='Metric'?'selected':''}>Metric (Native)</option><option value="MGD" ${displaySystem==='MGD'?'selected':''}>MGD</option></select></label></div>
 <div class="banner info">Detected in file: <b>${esc(detected)}</b>. Changing display units converts only what you see. ICM CSV export remains in native Metric values.</div>
 <div class="page-actions"><button class="subtle" id="cancelImport">Cancel</button><button class="primary" id="confirmImport">Import XPX</button></div>`);
 $('cancelImport').onclick=closeDialog;$('confirmImport').onclick=()=>{const src=$('sourceUnits').value,disp=$('importDisplayUnits').value;if(src!==detected){notice(`XPX header indicates ${detected}, but ${src} was selected. Select the correct units.`,true);return}displaySystem=disp;closeDialog();loadText(text,filename,src)};
}
$('fileInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(file)configureXpxImport(await file.text(),file.name)};
// The ICM ZIP does not guarantee a unit marker. Always require an explicit
// declaration before parsing and normalizing the CSV tables.
function configureIcmZipImport(file){
 dialog('Import ICM CSV ZIP · Select units',`<p>The ZIP must contain <code>runoff_surface.csv</code>, <code>landuse.csv</code>, and <code>subcatchment.csv</code>. ICM CSV files may not identify their units: select the units used when the CSVs were exported.</p>
 <div class="form-stack"><label>Units of the imported ICM CSV values (required)<select id="icmSourceUnits" required><option value="">Choose export units…</option><option value="Metric">Metric (Native)</option><option value="MGD">MGD (US customary display units)</option></select></label><label>Application display units<select id="icmDisplayUnits"><option value="Metric" ${displaySystem==='Metric'?'selected':''}>Metric (Native)</option><option value="MGD" ${displaySystem==='MGD'?'selected':''}>MGD</option></select></label></div>
 <div class="banner info"><strong>Choose the units used to export from ICM, not the units of the source XPX.</strong> Imported values are normalized to ICM native Metric for editing/export. Unknown CSV fields are preserved. For MGD ZIPs, verify any extra unit-sensitive fields outside supported SWMM land-use columns.</div>
 <div class="page-actions"><button class="subtle" id="cancelIcmImport">Cancel</button><button class="primary" id="confirmIcmImport">Load ICM ZIP</button></div>`);
 $('cancelIcmImport').onclick=closeDialog;
 $('confirmIcmImport').onclick=async()=>{
  const selected=$('icmSourceUnits').value,display=$('icmDisplayUnits').value;
  if(!selected){notice('Select the units of the ICM CSV export.',true);$('icmSourceUnits').focus();return;}
  $('confirmIcmImport').disabled=true;
  try{
   if(file.size>30*1024*1024)throw Error('ZIP exceeds the 30 MB safety limit.');
   const zip=await JSZip.loadAsync(file),matches={},seen=new Set();
   const entries=Object.values(zip.files).filter(entry=>!entry.dir);
   if(entries.length>40)throw Error('ZIP has too many files (maximum 40).');
   for(const entry of entries){
    const table=normalizeFileName(entry.name);
    if(!table||!entry.name.toLowerCase().endsWith('.csv'))continue;
    if(seen.has(table))throw Error(`Duplicate ICM ${table} CSV found in ZIP.`);
    seen.add(table);
    const text=await entry.async('string');
    if(text.length>20*1024*1024)throw Error(`${entry.name} exceeds 20 MB unpacked.`);
    matches[`${table}.csv`]=text;
   }
   const imported=startIcmCsvConversion(matches,ref,{filename:file.name,unitSystem:selected});
   // Only commit UI state after validation succeeds.
   session=imported;displaySystem=display;step=1;tab='soil';selectedModel=imported.project.libraries[0]?.key;
   checked.clear();search='';sqlIds=null;sqlOrderedIds=null;sqlMessage='';lastPreview=null;
   closeDialog();render();const bad=imported.surfaceValidation?.unsupportedSubcatchmentIds.length||0;
   notice(`Imported ${file.name} as ${selected}. ${bad} subcatchment(s) flagged as nonconforming; original CSV rows retained.`,bad>0);
  }catch(err){notice(`ICM ZIP import failed: ${err.message}`,true);$('confirmIcmImport').disabled=false;}
 };
}
$('icmZipInput').onchange=e=>{const file=e.target.files[0];e.target.value='';if(file)configureIcmZipImport(file)};

$('displayUnitSystem').onchange=e=>{displaySystem=e.target.value;render()};$('importBtn').onclick=()=>$('fileInput').click();$('importIcmBtn').onclick=()=>$('icmZipInput').click();$('tryDemo').onclick=loadDemo;$('downloadTop').onclick=downloadZip;
render();
</script>
</body></html>
