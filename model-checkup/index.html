<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Hydraulic Model Checkup</title>
  <style>
/* Model Checkup styles. Plain CSS, no preprocessor. */

:root {
  --ink: #192a3b;
  --muted: #5d6d7c;
  --border: #dbe2e8;
  --light: #f5f7fa;
  --brand: #175b9a;
  --focus: #0765c5;
  --warn: #925816;
  --white: #fff;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: #f6f8fa;
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
main:focus { outline: none; }

/* ---------- Page chrome ---------- */

.page { max-width: 1040px; padding: 24px 24px 60px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 22px; }
.eyebrow { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--brand); font-weight: 750; margin: 0 0 7px; }
h1 { font-size: 29px; line-height: 1.2; letter-spacing: -.035em; margin: 0; }
p.subtitle { color: var(--muted); margin: 7px 0 0; }
.toolbar { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.footer { display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 11.5px; margin: 28px 2px; }

.navigation { display: flex; gap: 3px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 18px 11px; color: var(--muted); font-weight: 650; white-space: nowrap; }
.tab[aria-current="page"] { border-color: var(--brand); color: var(--brand); }
.tab:hover { background: #eef3f8; }

.notice {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid #bcd3e8;
  background: #eaf3fc;
  color: #244f76;
  padding: 10px 14px;
  border-radius: 8px;
  margin: 0 0 16px;
}
.notice[hidden] { display: none; }
.notice.error { border-color: #d9a7a2; background: #fff4f2; color: #7a2e22; }
.notice-close { border: 0; background: transparent; color: inherit; font-size: 20px; line-height: 1; padding: 0 4px; border-radius: 4px; }
.notice-close:hover { background: rgba(0, 0, 0, .08); }

/* ---------- Buttons ---------- */

.btn { border: 1px solid #c8d3de; background: #fff; color: #233c54; border-radius: 7px; padding: 9px 12px; min-height: 40px; font-size: 13px; font-weight: 650; }
.btn:hover { background: #f0f5fa; }
.btn.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
.btn.primary:hover { background: #104b80; }
.btn.small { padding: 6px 10px; min-height: 32px; font-size: 12px; }
.btn.icon { padding: 6px 8px; min-width: 32px; }
.btn.danger { color: #9f3a26; border-color: #e9c9c4; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Panels and questions ---------- */

.panel { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 23px 25px; margin: 0 0 17px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.panel-head h2, .panel h2 { font-size: 19px; letter-spacing: -.025em; margin: 0; }
.description { color: var(--muted); margin: 6px 0 18px; font-size: 13.5px; }
.muted { color: var(--muted); font-size: 13px; }
.count { font-weight: 600; color: #66829b; font-size: 12px; margin-left: 7px; }
.empty { padding: 18px; border: 1px dashed #cad5dd; border-radius: 8px; color: var(--muted); background: #fbfcfe; font-size: 13px; }
.hintbox { border-left: 3px solid #9ebfdc; background: #f2f7fb; color: #4d657b; padding: 10px 13px; margin-bottom: 15px; font-size: 13px; }

.question { padding: 13px 0; border-top: 1px solid #e9edf0; }
.question:first-child { border-top: 0; }
fieldset.question { border-left: 0; border-right: 0; border-bottom: 0; margin: 0; min-width: 0; }
fieldset.question:first-child { border-top: 0; }
.question-label { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; font-weight: 650; margin: 0 0 9px; font-size: 14px; }
legend.question-label { display: block; padding: 0; float: left; width: 100%; }
legend.question-label + * { clear: both; }
legend.question-label .ref-link, legend.question-label .help-link { margin-left: 7px; }
.question.note { background: #f6f9fc; padding: 13px; border-radius: 6px; color: #51677c; border: 0; font-size: 13px; }
.question.note .question-label { font-weight: 400; margin: 0; }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; }

.ref-link { font-weight: 700; text-decoration: none; font-size: 10px; padding: 2px 4px; border-radius: 3px; background: #edf3fa; }
.ref-link:hover, .help-link:hover { text-decoration: underline; }
.help-link { font-weight: 600; text-decoration: none; font-size: 11px; padding: 2px 5px; border-radius: 3px; background: #eef6ee; color: #2d5a3d; }

.controls { display: flex; gap: 10px 17px; flex-wrap: wrap; }
.option-stack { display: flex; flex-direction: column; align-items: flex-start; }
.choice { display: inline-flex; align-items: flex-start; gap: 7px; font-size: 14px; line-height: 1.45; padding: 5px 0; cursor: pointer; }
.choice input { margin-top: 4px; accent-color: var(--brand); }
.choice input[type="checkbox"], .choice input[type="radio"] { width: 16px; height: 16px; }

.text-input, textarea, select { border: 1px solid #bfcdd9; border-radius: 6px; background: #fff; color: var(--ink); width: 100%; max-width: 630px; padding: 9px 11px; min-height: 41px; font-size: 14px; }
textarea { resize: vertical; min-height: 72px; }
select { max-width: 500px; }
.text-input[type="number"] { max-width: 220px; }
.text-input[type="date"] { max-width: 270px; }
.other-input { margin-top: 9px; display: block; max-width: 520px; }

/* ---------- Record lists ---------- */

.record-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.record-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fff; }
.record-row.dragging { opacity: .55; }
.record-row.drop-before { box-shadow: inset 0 3px 0 var(--brand); }
.record-drag { border: 0; background: transparent; color: #8a9bab; padding: 4px 6px; min-height: 32px; line-height: 1; cursor: grab; font-size: 14px; letter-spacing: -2px; border-radius: 4px; }
.record-drag:hover { background: #eef3f8; color: #4a6278; }
.record-drag:active { cursor: grabbing; }
.record-title { font-weight: 650; font-size: 14px; line-height: 1.35; }
.record-subtitle { font-size: 12px; margin-top: 2px; line-height: 1.35; color: var(--muted); }
.record-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Simulations ---------- */

.sim-shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; }
.sim-content { min-width: 0; }
.sim-picker { align-self: start; position: sticky; top: 10px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.sim-picker h2 { font-size: 15px; margin: 0 0 12px; }
.sim-list { margin-bottom: 10px; }
.sim-row { padding: 6px 8px; grid-template-columns: auto minmax(0, 1fr) auto; }
.sim-row.selected { border-color: #b5d4eb; background: #f7fbff; }
.sim-select { border: 0; background: transparent; text-align: left; padding: 6px 4px; color: #2b435a; font-size: 13px; font-weight: 600; width: 100%; border-radius: 4px; overflow-wrap: anywhere; }
.sim-select:hover { background: #f2f6fa; }
.sim-row.selected .sim-select { color: #134d81; font-weight: 700; }
.sim-move { display: flex; gap: 2px; }
.sim-move .btn.icon { min-height: 28px; min-width: 28px; padding: 2px 6px; }
.sim-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
.subnav button { border: 1px solid #c6d2dd; border-radius: 7px; padding: 8px 13px; background: #fff; font-weight: 600; font-size: 13px; color: #39526a; }
.subnav button.active { background: #e8f2fb; color: var(--brand); border-color: #9fc6e6; }

/* ---------- References ---------- */

.refs { display: grid; gap: 12px; }
.reference { border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; background: #fff; scroll-margin-top: 15px; }
.reference:target { outline: 2px solid #89b4de; }
.reference h3 { font-size: 15px; margin: 0 0 6px; }
.reference p { margin: 5px 0; color: var(--muted); font-size: 13px; }
.reference small { color: #667789; }

/* ---------- Record editor dialog ---------- */

.record-editor { border: 0; border-radius: 12px; padding: 0; max-width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 12px 40px rgba(25, 42, 59, .18); }
.record-editor::backdrop { background: rgba(25, 42, 59, .45); }
.record-editor-inner { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.record-editor-head { padding: 20px 22px 0; flex-shrink: 0; }
.record-editor-head h2 { font-size: 20px; margin: 0 0 6px; }
.record-editor-head .description { margin-bottom: 0; }
.record-editor-body { padding: 8px 22px 16px; overflow: auto; flex: 1; }
.record-editor-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }

/* ---------- Small screens and print ---------- */

@media (max-width: 750px) {
  .page { padding: 18px 13px 30px; }
  .top { flex-direction: column; }
  .toolbar { justify-content: flex-start; }
  .panel { padding: 17px 16px; }
  .sim-shell { display: block; }
  .sim-picker { position: static; margin-bottom: 14px; }
  .record-row { grid-template-columns: auto minmax(0, 1fr); }
  .record-row .record-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .sim-row { grid-template-columns: auto minmax(0, 1fr) auto; }
  .footer { display: block; }
  .footer span { display: block; margin: 6px 0; }
  .tab { padding-left: 12px; padding-right: 12px; }
}

@media print {
  body { background: #fff; }
  .toolbar, .navigation, .btn, .subnav, .footer, .sim-picker, .record-editor, .notice { display: none !important; }
  .page { max-width: none; padding: 0; }
  .panel { border: 0; padding: 10px 0; break-inside: avoid; }
  .question, .reference { break-inside: avoid; }
  .sim-shell { display: block; }
}

</style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Hydraulic model review</p>
        <h1>Model Checkup</h1>
        <p class="subtitle">A simple, repeatable engineering screening form.</p>
      </div>
      <div class="toolbar">
        <button type="button" id="new-project" class="btn ghost">New project</button>
        <button type="button" id="open-project" class="btn ghost">Open project</button>
        <button type="button" id="save-project" class="btn primary">Save project</button>
        <input type="file" id="file-input" accept="application/json,.json" hidden>
      </div>
    </header>
    <nav class="navigation" id="navigation" aria-label="Main sections"></nav>
    <div id="message" class="notice" role="status" hidden>
      <span id="message-text"></span>
      <button type="button" id="message-close" class="notice-close" aria-label="Dismiss message">&times;</button>
    </div>
    <main id="main" tabindex="-1"><p>Loading checklist…</p></main>
    <footer class="footer"><span id="save-status">Ready</span><span>Stored on this device until exported · Checklist snapshots stay with saved projects.</span></footer>
  </div>
  <dialog id="record-editor" class="record-editor" aria-labelledby="record-editor-title">
    <div class="record-editor-inner">
      <header class="record-editor-head">
        <h2 id="record-editor-title"></h2>
        <p id="record-editor-desc" class="description"></p>
      </header>
      <div id="record-editor-body" class="record-editor-body"></div>
      <footer class="record-editor-foot">
        <button type="button" class="btn primary" data-action="editor-done">Done</button>
        <button type="button" class="btn" data-action="editor-cancel">Cancel</button>
      </footer>
    </div>
  </dialog>

'use strict';

/* Model Checkup: checklist snapshot helpers (schema lookup, validation, layout fill-in). */
'use strict';

const FIELD_TYPES = ['text', 'date', 'number', 'textarea', 'radio', 'multi', 'select', 'reference', 'note'];
const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

 * The snapshot is untrusted: reject anything the renderer could not safely draw.

  if (!isObject(cl.forms)) fail('forms');
  if (!isObject(cl.collections)) fail('collections');
  if (!Array.isArray(cl.navigation) || !cl.navigation.length) fail('navigation');
  if (!Array.isArray(cl.references)) fail('references');
  for (const n of cl.navigation) {
    if (!isObject(n) || typeof n.id !== 'string' || typeof n.label !== 'string') fail('navigation entry');
  }
  for (const r of cl.references) {

    if (!Array.isArray(form)) fail('form ' + name);
    for (const f of fieldsOfForm(form)) {

      if (f.options !== undefined && !Array.isArray(f.options)) fail('options of ' + name + '.' + f.id);
      if (f.optionSets !== undefined && !isObject(f.optionSets)) fail('optionSets of ' + name + '.' + f.id);

      if (!d) continue;
      for (const k of LAYOUT_FIELD_KEYS) if (f[k] === undefined && d[k] !== undefined) f[k] = copy(d[k]);

'use strict';

/** Resolve a dotted store path such as "project.answers" or "simulation.screening.answers"; create objects on the way. */
function resolveStore(path) {
  const parts = String(path || '').split('.').filter(Boolean);
  if (!parts.length) return null;
  const root = parts[0] === 'project' ? currentProject() : parts[0] === 'simulation' ? selectedSimulation() : null;
  if (!root) return null;
  let node = root;
  for (const part of parts.slice(1)) {
    if (!isObject(node[part])) node[part] = {};
    node = node[part];
  }
  return node;
}

/** The array holding a collection's records for one simulation (or the project). */
function recordsForCollection(name, sim = selectedSimulation()) {
  const scope = collectionScope(name);

  if (name === 'simulations') return p.simulations;
  if (scope === 'project') {
    if (!Array.isArray(p[name])) p[name] = [];
    return p[name];

  if (!sim) return [];
  if (scope === 'simulation') {
    if (!Array.isArray(sim[name])) sim[name] = [];
    return sim[name];

  if (scope === 'simulation.screening') {
    if (!isObject(sim.screening)) sim.screening = {};
    if (!Array.isArray(sim.screening[name])) sim.screening[name] = [];

  return [];

/** Every record that was created from a given form schema, across the whole project. */
function recordsForSchema(schemaName) {
  const p = currentProject();
  const out = [];
  if (simulationEditorMeta()?.schema === schemaName) out.push(...p.simulations);
  for (const [name, meta] of Object.entries(doc.checklist.collections)) {
    if (meta.schema !== schemaName) continue;
    if (isSimulationScope(collectionScope(name))) p.simulations.forEach((s) => out.push(...recordsForCollection(name, s)));

    if (page.form === schemaName && page.store) return page;
    const tab = (page.tabs || []).find((t) => t.form === schemaName && t.store);
    if (tab) return tab;

function moveRecordTo(collection, id, finalIndex) {

  moveRecordTo(collection, id, from + delta);
  draw();
  const wanted = `[data-action="move-${delta < 0 ? 'up' : 'down'}"][data-collection="${CSS.escape(collection)}"][data-id="${CSS.escape(id)}"]`;
  const btn = document.querySelector(wanted + ':not(:disabled)') ||
    document.querySelector(`[data-action="move-${delta < 0 ? 'down' : 'up'}"][data-collection="${CSS.escape(collection)}"][data-id="${CSS.escape(id)}"]:not(:disabled)`);
  btn?.focus();
}

/** Copy only the selections and descriptive fields of a simulation. Screening, findings and issues are never copied. */
function duplicateSimulation(source) {
  const sim = blankSimulation();
  for (const f of flatFormFields(simulationEditorMeta().schema)) {
    if (f.type === 'note' || f.id === 'name') continue;
    sim[f.id] = copy(source[f.id] ?? blankValue(f));
  }
  sim.name = (source.name || 'Simulation') + ' (copy)';
  return sim;
}

/* Model Checkup: generic rendering. Headings, descriptions, tabs and labels all come from the checklist. */
'use strict';

/* ---------- Record labels and option lists ---------- */

function valueLabel(options, val) {
  return options.find((x) => x.value === val)?.label || val || '';
}

function recordPreviewParts(meta, item) {
  const schema = meta.schema;
  const values = (meta.previewFields || []).map((fid) => displayFieldValue(schema, fid, item)).filter(Boolean);
  const title = values[0] || `Untitled ${meta.itemLabel || 'entry'}`;
  let subtitle = '';
  if (meta.previewSubtitleFields?.length) {
    subtitle = meta.previewSubtitleFields.map((fid) => displayFieldValue(schema, fid, item)).filter(Boolean).join(' · ');
  } else if (values.length > 1) {
    subtitle = values.slice(1).join(' · ');
  }
  return { title, subtitle };
}

/** Text used for a shared record inside a <select>. */
function sharedRecordLabel(collectionName, item) {
  const meta = collectionMeta(collectionName);
  if (!meta) return item.name || item.id;
  const { title, subtitle } = recordPreviewParts(meta, item);
  return [title, subtitle].filter(Boolean).join(' · ');
}

function optionList(field, record) {
  if (field.type === 'reference') {
    let list = recordsForCollection(field.source);
    if (field.typePrefixes && field.filterBy) {
      const prefix = field.typePrefixes[record[field.filterBy]];
      if (prefix) list = list.filter((item) => String(item.type || '').startsWith(prefix));
    }
    if (Array.isArray(field.filterTypes)) list = list.filter((item) => field.filterTypes.includes(item.type));
    return list.map((item) => ({ value: item.id, label: sharedRecordLabel(field.source, item) }));
  }
  return field.optionsBy ? (field.optionSets?.[record[field.optionsBy]] || []) : (field.options || []);
}

function displayFieldValue(schemaName, fieldId, record) {
  const val = record?.[fieldId];
  if (val === undefined || val === null || val === '') return '';
  const field = getFieldDef(schemaName, fieldId);
  if (!field) return String(val);
  if (field.type === 'select' || field.type === 'radio') return valueLabel(optionList(field, record), val) || String(val);
  if (field.type === 'reference') {
    const target = recordsForCollection(field.source).find((r) => r.id === val);
    if (!target) return String(val);
    const meta = collectionMeta(field.source);
    return meta ? recordPreviewParts(meta, target).title : (target.name || String(val));
  }
  if (field.type === 'multi' && Array.isArray(val)) return val.filter(Boolean).join(', ');
  return String(val);
}

/* ---------- Field and form rendering ---------- */

function contextValue(path, record) {
  if (!String(path).includes('.')) return record?.[path];
  const root = { project: currentProject(), record, simulation: selectedSimulation() };
  return String(path).split('.').reduce((acc, segment) => acc?.[segment], root);
}

function isVisible(field, record) {
  if (!field.visibleWhen) return true;
  return (field.visibleWhen.in || []).includes(contextValue(field.visibleWhen.field, record));
}

function refLinks(field) {
  return (field.references || [])
    .filter((id) => doc.checklist.references.some((r) => r.id === id))
    .map((id) => ` <a class="ref-link" href="#ref-${escapeHtml(id)}" data-ref="${escapeHtml(id)}" title="View reference ${escapeHtml(id)}">${escapeHtml(id)}</a>`)
    .join('');
}

function helpLinks(field) {
  const url = safeHttpUrl(field.helpUrl);
  if (!url) return '';
  const label = field.helpLinkLabel || 'ICM help ↗';
  return ` <a class="help-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
}

const fieldAsideLinks = (field) => refLinks(field) + helpLinks(field);

function renderField(field, kind, id) {
  const record = getRecord(kind, id) || {};
  if (!isVisible(field, record)) return '';
  const key = field.id;
  const raw = record[key];
  const val = raw ?? (field.type === 'multi' ? [] : '');
  const tag = `${kind}-${id || 'single'}-${key}`.replace(/[^a-zA-Z0-9_-]/g, '_');
  const attrs = `data-kind="${escapeHtml(kind)}" data-owner="${escapeHtml(id || '')}" data-field="${escapeHtml(key)}"`;
  const options = optionList(field, record);
  const labelInner = escapeHtml(field.label || '') + (field.help ? ` <span class="hint">${escapeHtml(field.help)}</span>` : '') + fieldAsideLinks(field);

  if (field.type === 'note') return `<div class="question note"><p class="question-label">${labelInner}</p></div>`;

  let control = '';
  if (field.type === 'text' || field.type === 'date' || field.type === 'number') {
    const n = field.type === 'number' ? `step="${escapeHtml(field.step ?? 'any')}" ${field.min !== undefined ? `min="${escapeHtml(field.min)}"` : ''}` : '';
    control = `<input id="${tag}" class="text-input" type="${field.type}" value="${escapeHtml(val)}" placeholder="${escapeHtml(field.placeholder || '')}" ${n} ${attrs}>`;
  } else if (field.type === 'textarea') {
    control = `<textarea id="${tag}" rows="${Number(field.rows || 2)}" ${attrs}>${escapeHtml(val)}</textarea>`;
  } else if (field.type === 'select' || field.type === 'reference') {
    const required = field.type === 'reference' && field.allowBlank === false;
    const blank = field.type === 'reference' ? (required ? 'Select a shared record…' : 'Select a shared record (optional)') : 'Select one…';
    const list = (required ? [] : [`<option value="">${escapeHtml(blank)}</option>`])
      .concat(options.map((o) => `<option value="${escapeHtml(o.value)}" ${String(val) === String(o.value) ? 'selected' : ''}>${escapeHtml(o.label)}</option>`));
    if (val && !options.some((o) => String(o.value) === String(val))) list.push(`<option value="${escapeHtml(val)}" selected>Reference unavailable: ${escapeHtml(val)}</option>`);
    control = `<select id="${tag}" ${attrs}>${list.join('')}</select>`;
  } else if (field.type === 'radio' || field.type === 'multi') {
    const multi = field.type === 'multi';
    const array = Array.isArray(val) ? val : [];
    const choices = options.map((o) => {
      const checked = multi ? array.includes(o.value) : val === o.value;
      return `<label class="choice"><input type="${multi ? 'checkbox' : 'radio'}" name="${tag}" value="${escapeHtml(o.value)}" ${checked ? 'checked' : ''} ${attrs}><span>${escapeHtml(o.label)}</span></label>`;
    }).join('');
    control = `<div class="${multi ? 'option-stack' : 'controls'}">${choices}</div>`;
  }

  const isOther = field.allowOther && (Array.isArray(val) ? val.includes('other') : val === 'other');
  if (isOther) {
    control += `<input class="text-input other-input" aria-label="Specify other for ${escapeHtml(field.label)}" placeholder="Please specify" value="${escapeHtml(record[key + 'Other'] || '')}" data-kind="${escapeHtml(kind)}" data-owner="${escapeHtml(id || '')}" data-field="${escapeHtml(key)}Other">`;
  }

  // Choice groups get a fieldset/legend so assistive tech announces the question with every option.
  if (field.type === 'radio' || field.type === 'multi') {
    return `<fieldset class="question"><legend class="question-label">${labelInner}</legend>${control}</fieldset>`;
  }
  return `<div class="question"><label class="question-label" for="${tag}">${labelInner}</label>${control}</div>`;
}

function renderForm(schemaName, kind, id = '') {
  const form = doc.checklist.forms[schemaName] || [];
  if (form.length && Array.isArray(form[0].fields)) {
    return form.map((g) => `<div class="form-group"><div class="panel-head"><h2>${escapeHtml(g.title)}</h2></div>${g.description ? `<p class="description">${escapeHtml(g.description)}</p>` : ''}${g.fields.map((f) => renderField(f, kind, id)).join('')}</div>`).join('');
  }
  return form.map((f) => renderField(f, kind, id)).join('');
}

/* ---------- Lists of records ---------- */

const panel = (content, className = '') => `<section class="panel ${className}">${content}</section>`;

function renderDragHandle(collection, id) {
  return `<button type="button" class="record-drag" draggable="true" title="Drag to reorder" aria-label="Drag to reorder" data-action="drag-handle" data-collection="${escapeHtml(collection)}" data-id="${escapeHtml(id)}">⋮⋮</button>`;
}

function renderMoveButtons(collection, id, title, index, count) {
  const attrs = `data-collection="${escapeHtml(collection)}" data-id="${escapeHtml(id)}"`;
  return `<button type="button" class="btn small icon" data-action="move-up" ${attrs} aria-label="Move ${escapeHtml(title)} up" title="Move up" ${index === 0 ? 'disabled' : ''}>↑</button>`
    + `<button type="button" class="btn small icon" data-action="move-down" ${attrs} aria-label="Move ${escapeHtml(title)} down" title="Move down" ${index >= count - 1 ? 'disabled' : ''}>↓</button>`;
}

function renderRecordRow(collection, item, meta, index, count) {
  const { title, subtitle } = recordPreviewParts(meta, item);
  const editLabel = meta.editLabel || 'Edit';
  const ref = `data-collection="${escapeHtml(collection)}" data-id="${escapeHtml(item.id)}"`;
  return `<div class="record-row" data-reorder-id="${escapeHtml(item.id)}">${renderDragHandle(collection, item.id)}`
    + `<div class="record-summary"><div class="record-title">${escapeHtml(title)}</div>${subtitle ? `<div class="record-subtitle">${escapeHtml(subtitle)}</div>` : ''}</div>`
    + `<div class="record-actions">${renderMoveButtons(collection, item.id, title, index, count)}`
    + `<button type="button" class="btn small" data-action="edit-record" ${ref}>${escapeHtml(editLabel)}</button>`
    + `<button type="button" class="btn small danger" data-action="delete" ${ref}>Remove</button></div></div>`;
}

function renderCollection(name) {
  const meta = collectionMeta(name);
  if (!meta) return '';
  const items = recordsForCollection(name);
  const addLabel = meta.addLabel || 'Add';
  const addBtn = `<button type="button" class="btn small" data-action="add" data-collection="${escapeHtml(name)}">+ ${escapeHtml(addLabel)}</button>`;
  const top = `<div class="panel-head"><h2>${escapeHtml(meta.title)} <span class="count">${items.length}</span></h2>${addBtn}</div><p class="description">${escapeHtml(meta.description || '')}</p>`;
  const rows = items.length
    ? `<div class="record-list" data-reorder-collection="${escapeHtml(name)}">${items.map((item, i) => renderRecordRow(name, item, meta, i, items.length)).join('')}</div>`
    : `<p class="empty">No entries yet. Choose “${escapeHtml(addLabel)}” to start.</p>`;
  return panel(top + rows);
}

/* ---------- Pages ---------- */

function pageIntro(page) {
  return `<h2>${escapeHtml(page.title || page.label)}</h2>${page.description ? `<p class="description">${escapeHtml(page.description)}</p>` : ''}`;
}

/** A page is an optional single form plus any number of repeatable collections, all named by the checklist. */
function renderPage(page) {
  const form = page.form ? panel(pageIntro(page) + renderForm(page.form, page.form)) : '';
  return form + (page.collections || []).map(renderCollection).join('');
}

function linkedRecordName(collectionName, id) {
  if (!id) return '';
  const item = recordsForCollection(collectionName).find((x) => x.id === id);
  return item ? sharedRecordLabelTitle(collectionName, item) : '';
}
function sharedRecordLabelTitle(collectionName, item) {
  const meta = collectionMeta(collectionName);
  return meta ? recordPreviewParts(meta, item).title : (item.name || '');
}

/** One-line summary of the shared definitions a simulation selects, from its reference fields. */
function simulationConditionsSummary(sim) {
  const meta = simulationEditorMeta();
  const { title, subtitle } = meta ? recordPreviewParts(meta, sim) : { title: sim.name || 'Untitled simulation', subtitle: '' };
  const bits = [];
  for (const f of flatFormFields(meta?.schema)) {
    if (f.type !== 'reference' || !sim[f.id]) continue;
    const name = linkedRecordName(f.source, sim[f.id]);
    if (name) bits.push(`${f.label}: ${name}`);
  }
  return { title, subtitle: bits.join(' · ') || subtitle };
}

function renderSimulationPicker(sims, selected, meta) {
  const addLabel = meta?.addLabel || 'Add simulation';
  const rows = sims.length
    ? sims.map((s, i) => {
      const { title } = meta ? recordPreviewParts(meta, s) : { title: s.name || 'Untitled simulation' };
      const isSel = selected?.id === s.id;
      return `<div class="record-row sim-row ${isSel ? 'selected' : ''}" data-reorder-id="${escapeHtml(s.id)}">${renderDragHandle('simulations', s.id)}`
        + `<button type="button" class="sim-select" data-action="select-sim" data-id="${escapeHtml(s.id)}" ${isSel ? 'aria-current="true"' : ''}>${escapeHtml(title)}</button>`
        + `<div class="sim-move">${renderMoveButtons('simulations', s.id, title, i, sims.length)}</div></div>`;
    }).join('')
    : `<p class="muted">${escapeHtml(meta?.emptyListText || '')}</p>`;
  return `<aside class="sim-picker"><h2>${escapeHtml(meta?.pickerTitle || 'Simulations')} <span class="count">${sims.length}</span></h2>`
    + `<div class="sim-list record-list" data-reorder-collection="simulations">${rows}</div>`
    + `<div class="sim-toolbar"><button type="button" class="btn small primary" data-action="add-sim">+ ${escapeHtml(addLabel)}</button>`
    + `<button type="button" class="btn small" data-action="duplicate-sim" ${!selected ? 'disabled' : ''}>Duplicate</button></div></aside>`;
}

function renderSimulationTab(tab) {
  const hint = tab.hint
    ? `<div class="hintbox">${escapeHtml(tab.hint.text)} <button type="button" class="btn small" data-action="go-page" data-page="${escapeHtml(tab.hint.page)}">${escapeHtml(tab.hint.linkLabel)}</button>.</div>`
    : '';
  const intro = tab.title || tab.description || hint || tab.form
    ? panel(pageIntro({ title: tab.title, label: tab.label, description: tab.description }) + hint + (tab.form ? renderForm(tab.form, tab.form) : ''))
    : '';
  return intro + (tab.collections || []).map(renderCollection).join('');
}

function renderSimulationView(page) {
  const sims = currentProject().simulations;
  const selected = selectedSimulation();
  const meta = simulationEditorMeta();
  const list = renderSimulationPicker(sims, selected, meta);
  if (!selected) {
    return `<div class="sim-shell">${list}<section class="panel sim-content"><h2>${escapeHtml(meta?.emptyTitle || '')}</h2><p class="description">${escapeHtml(meta?.emptyDescription || '')}</p></section></div>`;
  }
  const tabs = page.tabs || [];
  const tab = tabs.find((t) => t.id === view.simTab) || tabs[0];
  const subnav = `<div class="subnav">${tabs.map((t) => `<button type="button" data-action="sim-tab" data-id="${escapeHtml(t.id)}" class="${tab?.id === t.id ? 'active' : ''}" ${tab?.id === t.id ? 'aria-current="true"' : ''}>${escapeHtml(t.label)}</button>`).join('')}</div>`;
  const summary = simulationConditionsSummary(selected);
  const info = panel(`<div class="panel-head"><h2>${escapeHtml(meta?.summaryTitle || 'Simulation')}</h2><div class="record-actions">${meta ? `<button type="button" class="btn small" data-action="edit-simulation" data-id="${escapeHtml(selected.id)}">${escapeHtml(meta.editLabel || 'Edit')}</button>` : ''}<button type="button" class="btn small danger" data-action="delete-sim">Remove simulation</button></div></div><div class="record-summary"><div class="record-title">${escapeHtml(summary.title)}</div>${summary.subtitle ? `<div class="record-subtitle">${escapeHtml(summary.subtitle)}</div>` : ''}</div>`);
  return `<div class="sim-shell">${list}<div class="sim-content">${info}${subnav}${tab ? renderSimulationTab(tab) : ''}</div></div>`;
}

function renderReferences(page) {
  const items = doc.checklist.references.map((r) => {
    const url = safeHttpUrl(r.url);
    const link = url
      ? `<p><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open source website ↗</a></p>`
      : (page.noLinkText ? `<p><em>${escapeHtml(page.noLinkText)}</em></p>` : '');
    return `<article class="reference" id="ref-${escapeHtml(r.id)}"><h3>[${escapeHtml(r.id)}] ${escapeHtml(r.title)}</h3><small>${escapeHtml(r.kind || '')}</small><p><strong>Where:</strong> ${escapeHtml(r.location)}</p><p>${escapeHtml(r.note)}</p>${link}</article>`;
  }).join('');
  return panel(pageIntro(page) + `<div class="refs">${items}</div>` + (page.footnote ? `<p class="description">${escapeHtml(page.footnote)}</p>` : ''));
}

const PAGE_RENDERERS = { page: renderPage, simulations: renderSimulationView, references: renderReferences };

function renderNav() {
  $('#navigation').innerHTML = doc.checklist.navigation
    .map((t) => `<button type="button" class="tab" data-action="tab" data-id="${escapeHtml(t.id)}" ${view.page === t.id ? 'aria-current="page"' : ''}>${escapeHtml(t.label)}</button>`)
    .join('');
}

function persistView() {
  writeStorage(sessionArea(), VIEW_KEY, JSON.stringify({ page: view.page, simTab: view.simTab, simId: view.simId }));
}

function draw() {
  if (!doc) return;
  const sims = currentProject().simulations;
  if (!selectedSimulation() && sims.length) view.simId = sims[0].id;
  if (!navigationPage(view.page)) view.page = doc.checklist.navigation[0].id;
  renderNav();
  const page = navigationPage(view.page);
  $('#main').innerHTML = (PAGE_RENDERERS[page.view] || renderPage)(page);
  $('#save-status').title = `Saved project uses checklist ${doc.checklist.version}`;
  persistView();
  if (view.editor) {
    syncEditorDialog();
    const dlg = $('#record-editor');
    if (dlg && !dlg.open && view.editor) dlg.showModal();
  }
}

/**
 * Re-render after a change that alters which fields exist, then put focus and scroll back where they were.
 * Without this, picking a radio that reveals another question would drop keyboard focus to the page top.
 */
function redrawKeepingFocus(el) {
  const spot = { kind: el.dataset.kind, owner: el.dataset.owner, field: el.dataset.field, value: el.value, type: el.type };
  const inDialog = Boolean(el.closest('#record-editor'));
  const body = $('#record-editor-body');
  const bodyScroll = body ? body.scrollTop : 0;
  const winScroll = window.scrollY;
  draw();
  const container = inDialog ? $('#record-editor') : $('#main');
  let selector = `[data-kind="${CSS.escape(spot.kind)}"][data-owner="${CSS.escape(spot.owner)}"][data-field="${CSS.escape(spot.field)}"]`;
  if (spot.type === 'radio' || spot.type === 'checkbox') selector += `[value="${CSS.escape(spot.value)}"]`;
  container?.querySelector(selector)?.focus({ preventScroll: true });
  if (body) body.scrollTop = bodyScroll;
  window.scrollTo({ top: winScroll, behavior: 'instant' });
}

/*
 * Model Checkup: the modal record editor.
 * Edits are applied to the live record as you type (so dependent fields update). Opening an existing record
 * keeps a backup copy; Cancel restores it, and Cancel on a newly added record removes that record.
 */
'use strict';

function editorMetaFor(editor) {
  return editor.kind === 'simulation' ? simulationEditorMeta() : collectionMeta(editor.collection);
}

function getEditorRecord(editor) {
  if (!editor) return null;
  if (editor.kind === 'simulation') return currentProject().simulations.find((s) => s.id === editor.recordId) || null;
  return recordsForCollection(editor.collection).find((x) => x.id === editor.recordId) || null;
}

function editorDialogTitle(editor, meta, record) {
  const addTitle = meta.addLabel || `Add ${meta.itemLabel || 'entry'}`;
  if (editor.mode === 'create') return addTitle;
  const { title } = recordPreviewParts(meta, record);
  const noun = meta.itemLabel || 'entry';
  return `${meta.editLabel || 'Edit'} — ${title === `Untitled ${noun}` ? noun : title}`;
}

function syncEditorDialog() {
  const dlg = $('#record-editor');
  if (!dlg || !view.editor) return;
  const meta = editorMetaFor(view.editor);
  const record = getEditorRecord(view.editor);
  if (!meta || !record) {
    view.editor = null;
    if (dlg.open) dlg.close();
    return;
  }
  $('#record-editor-title').textContent = editorDialogTitle(view.editor, meta, record);
  const desc = $('#record-editor-desc');
  desc.textContent = meta.description || '';
  desc.hidden = !meta.description;
  $('#record-editor-body').innerHTML = renderForm(meta.schema, meta.schema, record.id);
}

function openEditor(editor) {
  const meta = editorMetaFor(editor);
  if (!meta) {
    notify('This project’s checklist snapshot is missing editor settings. Use New project for the current form, or open a project file saved with an up-to-date checklist.', true);
    return;
  }
  if (editor.mode === 'edit') editor.backup = copy(getEditorRecord(editor));
  view.editor = editor;
  syncEditorDialog();
  const dlg = $('#record-editor');
  if (!dlg.open) dlg.showModal();
  dlg.querySelector('#record-editor-body input, #record-editor-body textarea, #record-editor-body select')?.focus();
}

/** Done keeps what was typed. Cancel discards: removes a just-added record, or restores an edited one. */
function closeEditor(cancel) {
  const dlg = $('#record-editor');
  const editor = view.editor;
  if (editor && cancel) {
    if (editor.mode === 'create') {
      if (editor.kind === 'simulation') {
        const sims = currentProject().simulations;
        const idx = sims.findIndex((s) => s.id === editor.recordId);
        if (idx >= 0) sims.splice(idx, 1);
        if (view.simId === editor.recordId) view.simId = sims[0]?.id || null;
      } else {
        const arr = recordsForCollection(editor.collection);
        const idx = arr.findIndex((x) => x.id === editor.recordId);
        if (idx >= 0) arr.splice(idx, 1);
      }
    } else if (editor.backup) {
      const record = getEditorRecord(editor);
      if (record) {
        for (const k of Object.keys(record)) delete record[k];
        Object.assign(record, editor.backup);
      }
    }
    autosave();
  }
  view.editor = null;
  if (dlg?.open) dlg.close();
  draw();
}

/* Model Checkup: events, actions, file import/export and start-up. */
'use strict';

/* ---------- Field edits ---------- */

/**
 * When a driver field changes, keep dependent selects valid: a single-option set auto-fills,
 * `resetOnChange` clears, and otherwise a value that is no longer offered is cleared.
 */
function syncDependents(schemaName, record, driverId) {
  for (const f of flatFormFields(schemaName)) {
    if (f.id === driverId) continue;
    const byOptions = f.optionsBy === driverId;
    const byFilter = Boolean(f.typePrefixes) && f.filterBy === driverId;
    if (!byOptions && !byFilter) continue;
    const opts = optionList(f, record);
    if (byOptions && opts.length === 1) record[f.id] = opts[0].value;
    else if (f.resetOnChange) record[f.id] = '';
    else if (record[f.id] && !opts.some((o) => o.value === record[f.id])) record[f.id] = '';
  }
}

function setField(el) {
  const record = getRecord(el.dataset.kind, el.dataset.owner);
  if (!record || !el.dataset.field) return;
  const key = el.dataset.field;
  if (el.type === 'checkbox') {
    const set = new Set(Array.isArray(record[key]) ? record[key] : []);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    record[key] = [...set];
  } else if (el.type === 'number') {
    record[key] = el.value.trim() === '' ? '' : Number(el.value);
  } else if (el.type === 'radio') {
    if (!el.checked) return;
    record[key] = el.value;
  } else {
    record[key] = el.value;
  }
  syncDependents(el.dataset.kind, record, key);
  autosave();
}

/* ---------- View state ---------- */

const firstSimTab = () => simulationTabs()[0]?.id || '';

function resetView() {
  view.page = doc.checklist.navigation[0].id;
  view.simId = currentProject().simulations[0]?.id || null;
  view.simTab = firstSimTab();
  view.editor = null;
  $('#record-editor')?.close();
}

/** A page refresh keeps you on the same page and simulation (per browser tab; not part of the saved project). */
function restoreView() {
  try {
    const saved = JSON.parse(readStorage(sessionArea(), VIEW_KEY) || 'null');
    if (!saved) return;
    if (navigationPage(saved.page)) view.page = saved.page;
    if (currentProject().simulations.some((s) => s.id === saved.simId)) view.simId = saved.simId;
    if (simulationTabs().some((t) => t.id === saved.simTab)) view.simTab = saved.simTab;
  } catch { /* ignore a corrupt view record */ }
}

function activate(page) {
  view.page = page;
  draw();
  window.scrollTo({ top: 0, behavior: 'instant' });
  $('#main').focus({ preventScroll: true });
}

/* ---------- Actions ---------- */

function doAction(target) {
  const action = target.dataset.action;
  const { collection, id } = target.dataset;
  switch (action) {
    case 'tab': return activate(id);
    case 'go-page': return activate(target.dataset.page);
    case 'sim-tab': view.simTab = id; return draw();
    case 'select-sim': view.simId = id; view.simTab = firstSimTab(); return draw();
    case 'add-sim': {
      const sim = blankSimulation();
      currentProject().simulations.push(sim);
      view.simId = sim.id;
      view.simTab = firstSimTab();
      autosave();
      return openEditor({ kind: 'simulation', recordId: sim.id, mode: 'create' });
    }
    case 'duplicate-sim': {
      const source = selectedSimulation();
      if (!source) return undefined;
      const sim = duplicateSimulation(source);
      currentProject().simulations.push(sim);
      view.simId = sim.id;
      view.simTab = firstSimTab();
      autosave();
      return draw();
    }
    case 'delete-sim': {
      const sim = selectedSimulation();
      if (!sim || !confirm(`Delete simulation “${sim.name || 'Untitled'}” and ALL its findings?`)) return undefined;
      currentProject().simulations = currentProject().simulations.filter((x) => x.id !== sim.id);
      if (view.editor?.kind === 'simulation' && view.editor.recordId === sim.id) view.editor = null;
      view.simId = currentProject().simulations[0]?.id || null;
      autosave();
      return draw();
    }
    case 'add': {
      const record = addRecord(collection);
      autosave();
      return openEditor({ kind: 'collection', collection, recordId: record.id, mode: 'create' });
    }
    case 'delete': return removeRecord(collection, id);
    case 'edit-record': return openEditor({ kind: 'collection', collection, recordId: id, mode: 'edit' });
    case 'edit-simulation': return openEditor({ kind: 'simulation', recordId: id, mode: 'edit' });
    case 'editor-done': return closeEditor(false);
    case 'editor-cancel': return closeEditor(true);
    case 'move-up': return moveRecordBy(collection, id, -1);
    case 'move-down': return moveRecordBy(collection, id, 1);
    default: return undefined;
  }
}

/* ---------- Save / open ---------- */

function downloadJson() {
  const name = (currentProject().answers?.projectName || 'icm-model-checkup').replace(/[^a-z0-9_-]+/gi, '-').slice(0, 70);
  const blob = new Blob([JSON.stringify(doc, null, 2) + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = name + '.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
  markClean();
  notify('Saved project JSON includes checklist questions, references, answers and all linked objects.');
}

/** Opened files are untrusted: check the shape, then fill in structural keys without touching questions or answers. */
function validateOpen(parsed) {
  if (!isObject(parsed) || !isObject(parsed.project) || !isObject(parsed.checklist)) throw new Error('This is not a saved Model Checkup project JSON.');
  if (!parsed.fileVersion || String(parsed.fileVersion).split('.')[0] !== '1') throw new Error('Unsupported saved-project file version.');
  validateChecklistShape(parsed.checklist);
  applyLayoutDefaults(parsed.checklist);
  ensureShape(parsed);
  return parsed;
}

/** Non-blocking hint; the project always keeps its own checklist snapshot. */
function olderChecklistNotice() {
  if (!defaultChecklist || compareVersions(doc.checklist.version, defaultChecklist.version) >= 0) return '';
  return ` This project uses checklist ${doc.checklist.version}; a newer checklist (${defaultChecklist.version}) exists. The project keeps its own questions. Start a New project to use the newer checklist.`;
}

/* ---------- Drag reordering ---------- */

function reorderDropIndex(listEl, clientY) {
  const rows = [...listEl.querySelectorAll('.record-row')];
  for (let i = 0; i < rows.length; i++) {
    const rect = rows[i].getBoundingClientRect();
    if (clientY < rect.top + rect.height / 2) return i;
  }
  return rows.length;
}

function setupDragReorder() {
  document.addEventListener('dragstart', (event) => {
    const handle = event.target.closest('[data-action="drag-handle"]');
    if (!handle || $('#record-editor')?.open) return;
    dragPayload = { collection: handle.dataset.collection, id: handle.dataset.id };
    event.dataTransfer.setData('text/plain', JSON.stringify(dragPayload));
    event.dataTransfer.effectAllowed = 'move';
    handle.closest('.record-row')?.classList.add('dragging');
  });
  document.addEventListener('dragend', () => {
    dragPayload = null;
    document.querySelectorAll('.record-row.dragging, .record-row.drop-before').forEach((el) => el.classList.remove('dragging', 'drop-before'));
  });
  document.addEventListener('dragover', (event) => {
    const list = event.target.closest('[data-reorder-collection]');
    if (!list || !dragPayload || list.dataset.reorderCollection !== dragPayload.collection) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const rows = [...list.querySelectorAll('.record-row')];
    rows.forEach((r) => r.classList.remove('drop-before'));
    const idx = reorderDropIndex(list, event.clientY);
    if (rows[idx]) rows[idx].classList.add('drop-before');
  });
  document.addEventListener('drop', (event) => {
    const list = event.target.closest('[data-reorder-collection]');
    if (!list || !dragPayload) return;
    event.preventDefault();
    const collection = list.dataset.reorderCollection;
    if (collection !== dragPayload.collection) return;
    moveRecordToSlot(collection, dragPayload.id, reorderDropIndex(list, event.clientY));
    dragPayload = null;
  });
}

/* ---------- Start-up ---------- */

function setup() {
  setupDragReorder();
  const redrawKeys = () => redrawTriggerKeys(doc.checklist);

  $('#record-editor')?.addEventListener('cancel', (event) => {
    event.preventDefault();
    closeEditor(true);
  });
  document.addEventListener('click', (event) => {
    const ref = event.target.closest('[data-ref]');
    if (ref) {
      event.preventDefault();
      activate('references');
      const dest = $('#ref-' + CSS.escape(ref.dataset.ref));
      if (dest) {
        dest.scrollIntoView({ behavior: 'smooth', block: 'start' });
        dest.style.outline = '2px solid #89b4de';
        setTimeout(() => { dest.style.outline = ''; }, 2000);
      }
      return;
    }
    const target = event.target.closest('[data-action]');
    if (target && !target.disabled) doAction(target);
  });
  document.addEventListener('input', (event) => {
    const el = event.target;
    if (el.matches('[data-field]') && !['radio', 'checkbox', 'select-one'].includes(el.type)) setField(el);
  });
  document.addEventListener('change', (event) => {
    const el = event.target;
    if (!el.matches('[data-field]') || !['radio', 'checkbox', 'select-one'].includes(el.type)) return;
    setField(el);
    if (redrawKeys().has(el.dataset.field)) redrawKeepingFocus(el);
  });

  $('#message-close').addEventListener('click', dismissNotice);
  $('#new-project').addEventListener('click', () => {
    if (!confirm('Start a new project? Save the current project JSON first if you need a copy.')) return;
    doc = newProject();
    resetView();
    autosave();
    markClean();
    draw();
    notify('New project created from the current default checklist.');
  });
  $('#open-project').addEventListener('click', () => $('#file-input').click());
  $('#file-input').addEventListener('change', async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    try {
      const parsed = validateOpen(JSON.parse(await file.text()));
      doc = parsed;
      resetView();
      autosave();
      markClean();
      draw();
      notify(`Opened saved project with checklist ${doc.checklist.version}.` + olderChecklistNotice());
    } catch (e) {
      notify('Could not open file: ' + e.message, true);
    } finally {
      event.target.value = '';
    }
  });
  $('#save-project').addEventListener('click', downloadJson);
  window.addEventListener('beforeunload', (event) => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });
}

async function loadDefaultChecklist() {
  const embedded = $('#embedded-default-checklist');
  if (embedded) return JSON.parse(embedded.textContent);
  const res = await fetch('default-checklist.json');
  if (!res.ok) throw new Error(`Checklist could not be loaded (${res.status})`);
  return res.json();
}

async function init() {
  try {
    defaultChecklist = await loadDefaultChecklist();
    validateChecklistShape(defaultChecklist);
    const stored = readStorage(localArea(), STORAGE_KEY);
    let notice = '';
    let isError = false;
    if (stored) {
      try {
        doc = validateOpen(JSON.parse(stored));
        notice = olderChecklistNotice().trim();
      } catch (e) {
        // Never silently overwrite what the user had: keep the unreadable copy under a backup key.
        writeStorage(localArea(), BACKUP_KEY, stored);
        doc = newProject();
        isError = true;
        notice = `The autosaved copy in this browser could not be read (${e.message}) and was kept under a backup key. A new project was started.`;
      }
    } else {
      doc = newProject();
    }
    resetView();
    restoreView();
    setup();
    draw();
    renderSaveStatus();
    if (notice) notify(notice, isError);
  } catch (e) {
    $('#main').innerHTML = `<section class="panel"><h2>Could not load the checklist</h2><p>${escapeHtml(e.message)}</p><p>For source files, run <code>python3 -m http.server 8000</code> inside the app folder, or open the standalone offline HTML in <code>dist/</code>.</p></section>`;
  }
}

init();

})();
</script>
</body>
